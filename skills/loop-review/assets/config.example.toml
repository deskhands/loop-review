version = 1

[paths]
run_root = "~/code/agents-tmp/loop-review"

[loop]
max_cycles = 2
max_model_calls = 6

# Pi reviewer for OpenRouter/Qwen. Configure Pi/OpenRouter auth separately.
[reviewers.qwen]
adapter = "pi"
executable = "pi"
model = "qwen/qwen3.8-flash"
reasoning = "high"
timeout_seconds = 1800

# Provider-isolated Claude Code launcher for DeepSeek official.
[reviewers.deepseek]
adapter = "claude"
executable = "claude-deepseek"
model = "deepseek-flash[1m]"
reasoning = "max"
timeout_seconds = 1800
