version = 2

[paths]
run_root = "~/code/agents-tmp/loop-review"

[limits]
max_task_attempts = 6
max_turns = 32
max_tool_calls = 48
max_identical_tool_calls = 3
max_provider_retries = 2
max_total_tokens = 8000000
max_run_seconds = 1800
max_prompt_bytes = 65536
max_output_bytes = 52428800

# Existing model choices; model/provider evaluation is phase two.
[reviewers.qwen]
adapter = "pi"
executable = "pi"
model = "qwen/qwen3.8-flash"
reasoning = "high"
timeout_seconds = 1800

[reviewers.deepseek]
adapter = "claude"
executable = "claude-deepseek"
model = "deepseek-flash[1m]"
reasoning = "max"
timeout_seconds = 1800
