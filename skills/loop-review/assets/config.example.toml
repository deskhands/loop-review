version = 1

[paths]
run_root = "~/code/agents-tmp/loop-review"

[loop]
max_cycles = 2
max_model_calls = 6

# Provider-isolated Claude Code launcher for OpenRouter/GLM.
[reviewers.glm]
adapter = "claude"
executable = "claude-glm"
model = "z-ai/glm-5.3-flash"
reasoning = "high"
timeout_seconds = 1800

# Provider-isolated Claude Code launcher for DeepSeek official.
[reviewers.deepseek]
adapter = "claude"
executable = "claude-deepseek"
model = "deepseek-flash[1m]"
reasoning = "max"
timeout_seconds = 1800
